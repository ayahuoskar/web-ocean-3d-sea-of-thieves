<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#04101d" />
    <title>Web Ocean 3D — Realtime WebGPU Ocean</title>
    <meta
      name="description"
      content="A realtime spectral ocean rendered with Three.js, WebGPU and TSL: FFT waves, physically based water lighting, caustics, foam, buoyancy and underwater transitions."
    />
    <!-- Inline so there is no favicon round-trip (and no 404 when none is served). -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23071a2b'/%3E%3Cpath d='M2 20c3.2 0 3.2-3 6.4-3s3.2 3 6.4 3 3.2-3 6.4-3 3.2 3 6.4 3 2.4-1.2 4.4-2.4' stroke='%233ba7f5' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3Cpath d='M2 26c3.2 0 3.2-3 6.4-3s3.2 3 6.4 3 3.2-3 6.4-3 3.2 3 6.4 3' stroke='%231f7bbd' stroke-width='2' fill='none' stroke-linecap='round' opacity='.75'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="viewport" aria-label="Realtime ocean viewport"></canvas>
      <div id="ui-root"></div>
      <div id="boot" class="boot">
        <div class="boot__inner">
          <div class="boot__title">WEB <span>OCEAN</span> 3D</div>
          <div class="boot__bar"><i id="boot-bar"></i></div>
          <div class="boot__status" id="boot-status">Initialising renderer…</div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
